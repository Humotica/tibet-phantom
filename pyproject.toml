[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tibet-phantom"
version = "0.1.0"
description = "Zero-footprint AI materialization. Compute once on GPU, verify everywhere, materialize only with proof."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "J. van de Meent", email = "jasper@humotica.com"},
    {name = "Root AI", email = "root_idd@humotica.nl"},
]
keywords = [
    "ai", "llm", "edge", "materialization", "provenance",
    "zero-trust", "phantom", "tibet", "upip", "rvp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]

dependencies = []

[project.optional-dependencies]
full = [
    "tibet-edge>=0.1.0",
    "tibet-mesh>=0.1.0",
    "tibet-overlay>=0.1.0",
    "tlex-edge>=0.1.0",
    "requests>=2.28.0",
]
edge = [
    "tlex-edge>=0.1.0",
]
transport = [
    "tibet-mesh>=0.1.0",
    "tibet-overlay>=0.1.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/Humotica/tibet-phantom"
Repository = "https://github.com/Humotica/tibet-phantom"
Documentation = "https://humotica.com"
"IETF UPIP" = "https://datatracker.ietf.org/doc/draft-vandemeent-upip-process-integrity/"
"IETF RVP" = "https://datatracker.ietf.org/doc/draft-vandemeent-rvp-continuous-verification/"
"IETF TIBET" = "https://datatracker.ietf.org/doc/draft-vandemeent-tibet-provenance/"
"IETF JIS" = "https://datatracker.ietf.org/doc/draft-vandemeent-jis-identity/"

[project.scripts]
phantom = "phantom.__main__:main"

[tool.setuptools.packages.find]
include = ["phantom*"]
